  hono: 4.13.5
  '@hono/node-server': '>=2.0.5'
  qs: 6.16.0
  ip-address: '>=10.3.1'
  uuid: 11.1.1
  '@opentelemetry/core': 2.8.0
  js-yaml: '>=5.2.2'
