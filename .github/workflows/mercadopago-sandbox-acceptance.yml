name: Mercado Pago Sandbox Acceptance

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Sanitized authorized scenario identifier
        required: true
        type: choice
        options:
          - MP-01-hosted-checkout
      deployment_url:
        description: 'Exact official HTTPS origin: https://project-a89lv.vercel.app.'
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  mp-01-hosted-checkout:
    if: inputs.scenario == 'MP-01-hosted-checkout'
    name: MP-01 hosted checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This workflow always targets the official origin used by Mercado Pago and
    # Cloudflare. It is intentionally workflow_dispatch-only: creating a
    # checkout is not a safe per-push or nightly operation.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate canonical production origin
        run: test "${{ inputs.deployment_url }}" = "https://project-a89lv.vercel.app"

      - name: Run MP-01 against the deployed application
        run: pnpm exec playwright test src/test/e2e/mercadopago-cloud-acceptance.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          IROKO_E2E_TEST_USER_EMAIL: ${{ secrets.IROKO_E2E_TEST_USER_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MERCADOPAGO_CLOUD_ACCEPTANCE: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mercadopago-sandbox-playwright-report
          path: playwright-report/
          retention-days: 14
