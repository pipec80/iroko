name: Mercado Pago Sandbox Acceptance

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Sanitized authorized scenario identifier
        required: true
        type: choice
        options:
          - MP-01-hosted-checkout

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  mp-01-hosted-checkout:
    if: inputs.scenario == 'MP-01-hosted-checkout'
    name: MP-01 hosted checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This workflow always targets the official origin used by Mercado Pago and
    # Cloudflare. It is intentionally workflow_dispatch-only: creating a
    # checkout is not a safe per-push or nightly operation.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run MP-01 against the deployed application
        run: pnpm exec playwright test src/test/e2e/mercadopago-cloud-acceptance.spec.ts --project=chromium --reporter=line --trace=off
        env:
          PLAYWRIGHT_BASE_URL: https://project-a89lv.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          IROKO_E2E_TEST_USER_EMAIL: ${{ secrets.IROKO_E2E_TEST_USER_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MERCADOPAGO_CLOUD_ACCEPTANCE: '1'

      # Privileged Cloud acceptance emits sanitized status only. Browser reports
      # can embed credentials and one-use login URLs, including on failure.
