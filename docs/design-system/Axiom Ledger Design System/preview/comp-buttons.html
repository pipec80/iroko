<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom: 14px;">Buttons · poppy / outline / ghost / ink</div>
  <div class="row" style="gap: 10px; flex-wrap: wrap;">
    <button style="background: var(--color-poppy); color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; font-family: var(--font-sans); font-size: 13px; font-weight: 600; white-space: nowrap;">Crear proyecto</button>
    <button style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 4px; padding: 9px 18px; font-family: var(--font-sans); font-size: 13px; font-weight: 600; white-space: nowrap;">Ver documentación</button>
    <button style="background: transparent; color: var(--text-secondary); border: 0; padding: 10px 14px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; white-space: nowrap;">Cancelar</button>
    <button style="background: var(--color-ink); color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; font-family: var(--font-sans); font-size: 13px; font-weight: 600; white-space: nowrap;">Sign in</button>
    <button style="background: var(--color-poppy-wash); color: var(--color-poppy); border: 0; border-radius: 4px; padding: 9px 16px; font-family: var(--font-sans); font-size: 12px; font-weight: 600; white-space: nowrap;">Eliminar</button>
  </div>
  <div class="row" style="gap: 10px; margin-top: 14px;">
    <button style="background: var(--color-poppy); color: #fff; border: 0; border-radius: 4px; padding: 14px 28px; font-family: var(--font-sans); font-size: 15px; font-weight: 600; white-space: nowrap;">Empezar gratis →</button>
    <button style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 4px; padding: 13px 28px; font-family: var(--font-sans); font-size: 15px; font-weight: 600; white-space: nowrap;">Agendar demo</button>
  </div>
</div></body></html>
