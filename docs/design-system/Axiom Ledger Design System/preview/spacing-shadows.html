<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="sm / md / lg / xl / poppy-glow" -->
<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad" style="background: var(--surface-2); border-radius: 6px; padding: 24px;">
  <div class="label" style="margin-bottom: 18px;">Elevation · ink-tinted</div>
  <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;">
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 80px; height: 56px; background: #fff; border-radius: 6px; box-shadow: 0 1px 2px rgba(14,17,23,0.05);"></div>
        <div class="mono" style="font-size: 10px; color: var(--text-tertiary);">sm</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 80px; height: 56px; background: #fff; border-radius: 6px; box-shadow: 0 4px 12px -4px rgba(14,17,23,0.08);"></div>
        <div class="mono" style="font-size: 10px; color: var(--text-tertiary);">md</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 80px; height: 56px; background: #fff; border-radius: 6px; box-shadow: 0 10px 24px -8px rgba(14,17,23,0.10);"></div>
        <div class="mono" style="font-size: 10px; color: var(--text-tertiary);">lg</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 80px; height: 56px; background: #fff; border-radius: 6px; box-shadow: 0 24px 48px -12px rgba(14,17,23,0.14);"></div>
        <div class="mono" style="font-size: 10px; color: var(--text-tertiary);">xl</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 80px; height: 56px; background: #fff; border-radius: 6px; box-shadow: 0 0 0 1px rgba(217,33,33,0.35), 0 8px 24px -8px rgba(217,33,33,0.32);"></div>
        <div class="mono" style="font-size: 10px; color: var(--text-tertiary);">poppy</div>
      </div>
  </div>
</div></body></html>
