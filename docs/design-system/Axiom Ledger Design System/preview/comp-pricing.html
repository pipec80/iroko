<!-- @dsCard group="Components" viewport="700x260" name="Pricing" subtitle="Standard + featured ink" -->
<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Pricing</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom: 14px;">Pricing tier · standard + featured ink</div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start;">
    <div style="background:var(--surface-elevated);border:1px solid var(--border);border-radius:6px;padding:22px;">
      <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">Personal</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:14px;">Para tus proyectos en solitario.</div>
      <div class="mono" style="font-size:36px;font-weight:600;letter-spacing:-0.04em;color:var(--text-primary);line-height:1;">$0<span style="font-family:var(--font-sans);font-size:13px;color:var(--text-secondary);font-weight:400;">/mes</span></div>
      <button style="margin-top:16px;width:100%;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;padding:10px;font-family:var(--font-sans);font-size:13px;font-weight:600;">Empezar</button>
    </div>
    <div style="background:var(--color-ink);color:#fff;border-radius:6px;padding:22px;position:relative;box-shadow:var(--shadow-xl);">
      <span style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--color-poppy);color:#fff;padding:3px 12px;border-radius:999px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;">Más popular</span>
      <div style="font-size:16px;font-weight:600;margin-bottom:4px;">Studio</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.65);margin-bottom:14px;">Para tu agencia / múltiples productos.</div>
      <div class="mono" style="font-size:36px;font-weight:600;letter-spacing:-0.04em;line-height:1;">$49<span style="font-family:var(--font-sans);font-size:13px;color:rgba(255,255,255,0.65);font-weight:400;">/mes</span></div>
      <button style="margin-top:16px;width:100%;background:var(--color-poppy);color:#fff;border:0;border-radius:4px;padding:10px;font-family:var(--font-sans);font-size:13px;font-weight:600;">Empezar Studio</button>
    </div>
  </div>
</div></body></html>
