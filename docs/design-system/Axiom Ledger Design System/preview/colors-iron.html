<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Iron</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom: 12px;">Iron · Primary action (óxido)</div>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
    <div style="background:#8a3b2a;color:#fff;border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:84px;justify-content:space-between;font-family:var(--font-mono);">
    <div style="font-size:11px;font-weight:600;">iron-deep</div>
    <div>
      <div style="font-size:11px;font-weight:600;">#8A3B2A</div>
      <div style="font-size:9px;opacity:0.65;margin-top:2px;">pressed</div>
    </div>
  </div>
    <div style="background:#b8513a;color:#fff;border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:84px;justify-content:space-between;font-family:var(--font-mono);">
    <div style="font-size:11px;font-weight:600;">iron</div>
    <div>
      <div style="font-size:11px;font-weight:600;">#B8513A</div>
      <div style="font-size:9px;opacity:0.65;margin-top:2px;">primary</div>
    </div>
  </div>
    <div style="background:#d97a5f;color:#231a13;border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:84px;justify-content:space-between;font-family:var(--font-mono);">
    <div style="font-size:11px;font-weight:600;">iron-soft</div>
    <div>
      <div style="font-size:11px;font-weight:600;">#D97A5F</div>
      <div style="font-size:9px;opacity:0.65;margin-top:2px;">hover</div>
    </div>
  </div>
  </div>
  <div class="row" style="margin-top: 14px; gap: 10px; flex-wrap: wrap;">
    <span style="background: rgba(184,81,58,0.12); color: #b8513a; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; font-family: var(--font-sans);">iron-wash 12%</span>
    <span style="background: #b8513a; color: #fff; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: var(--font-sans);">Crear proyecto</span>
    <span style="border: 1px solid rgba(184,81,58,0.4); color: #b8513a; padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: var(--font-sans);">Outline</span>
  </div>
</div>
</body></html>
