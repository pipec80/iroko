<!-- @dsCard group="Components" viewport="700x240" name="Nav item" subtitle="Resting · hover · active" -->
<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Nav</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad" style="background:var(--surface-2);border-radius:6px;padding:18px;">
  <div class="label" style="margin-bottom: 12px;">Sidebar nav · resting · hover · active</div>
  <div style="display: flex; flex-direction: column; gap: 4px; max-width: 280px;">
    <div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:4px;color:var(--text-secondary);">
      <i data-lucide="layout-grid" style="stroke-width:1.5;width:18px;height:18px;"></i>
      <span style="font-size:13px;font-weight:500;">Overview</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:4px;color:var(--text-primary);background:var(--surface-3);">
      <i data-lucide="folder-tree" style="stroke-width:1.5;width:18px;height:18px;"></i>
      <span style="font-size:13px;font-weight:600;">Proyectos</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:4px;color:var(--color-poppy);background:var(--color-poppy-wash);position:relative;">
      <i data-lucide="users" style="stroke-width:1.5;width:18px;height:18px;"></i>
      <span style="font-size:13px;font-weight:700;">Miembros</span>
      <span style="margin-left:auto;width:5px;height:5px;border-radius:999px;background:var(--color-poppy);"></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:4px;color:var(--text-secondary);">
      <i data-lucide="credit-card" style="stroke-width:1.5;width:18px;height:18px;"></i>
      <span style="font-size:13px;font-weight:500;">Billing</span>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>lucide.createIcons();</script></body></html>
