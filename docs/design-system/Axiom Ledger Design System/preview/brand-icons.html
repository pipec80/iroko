<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom: 14px;">Iconography · Lucide · stroke 1.5</div>
  <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px;">
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">
        <i data-lucide="orbit" style="stroke-width: 1.5; width: 22px; height: 22px; color: var(--text-primary);"></i>
        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">Iroko</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">
        <i data-lucide="layout-grid" style="stroke-width: 1.5; width: 22px; height: 22px; color: var(--text-primary);"></i>
        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">Overview</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">

        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">Projects</span>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">

        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">Members</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">
        <i data-lucide="credit-card" style="stroke-width: 1.5; width: 22px; height: 22px; color: var(--text-primary);"></i>

        <i data-lucide="plus" style="stroke-width: 1.5; width: 22px; height: 22px; color: var(--text-primary);"></i>
        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">New</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">

      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">

      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">

        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">Done</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;">
        <i data-lucide="chevron-down" style="stroke-width: 1.5; width: 22px; height: 22px; color: var(--text-primary);"></i>
        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">Expand</span>

        <span class="mono" style="font-size: 8px; opacity: 0.6; color: var(--text-tertiary);">i18n</span>
      </div>
  </div>
  <div class="mono" style="margin-top: 12px; font-size: 10px; opacity: 0.55; color: var(--text-tertiary);">
    stroke 1.5 estándar Lucide · sube a 2.0 para active states
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>lucide.createIcons();</script></body></html>
