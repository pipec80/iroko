<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Table row</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom: 10px;">Data table · members row</div>
  <div style="background:var(--surface-elevated);border:1px solid var(--border);border-radius:6px;overflow:hidden;">
    <div style="display:grid;grid-template-columns:28px 2fr 1fr 1fr 1fr;gap:14px;align-items:center;padding:10px 16px;background:var(--surface-2);font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-tertiary);">
      <span></span><span>Miembro</span><span>Rol</span><span>Estado</span><span style="text-align:right;">Último acceso</span>
    </div>
    <div style="display:grid;grid-template-columns:28px 2fr 1fr 1fr 1fr;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--border);">
      <span style="width:28px;height:28px;border-radius:4px;background:var(--color-poppy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:11px;font-weight:700;">PC</span>
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text-primary);">Pipe Cárdenas</div>
        <div class="mono" style="font-size:11px;color:var(--text-tertiary);">pipec@iroko.dev</div>
      </div>
      <span style="background:var(--color-poppy);color:#fff;padding:3px 10px;border-radius:999px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;justify-self:start;">OWNER</span>
      <span style="background:rgba(30,138,79,0.12);color:#1e8a4f;padding:3px 10px;border-radius:999px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;justify-self:start;display:inline-flex;align-items:center;gap:6px;"><span style="width:5px;height:5px;border-radius:999px;background:#1e8a4f;"></span>ACTIVO</span>
      <span class="mono" style="font-size:12px;color:var(--text-secondary);text-align:right;">hace 2 min</span>
    </div>
  </div>
</div></body></html>
