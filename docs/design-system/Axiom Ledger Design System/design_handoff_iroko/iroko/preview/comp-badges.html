<!doctype html>
<!-- @dsCard group="Components" name="Components / Badges" --><html lang="es"><head>
<meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom: 14px;">Badges · status / role / chip</div>
  <div class="row" style="gap: 8px; flex-wrap: wrap;">
    <span style="background:rgba(30,138,79,0.12);color:#1e8a4f;padding:4px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:999px;background:#1e8a4f;"></span>ACTIVO</span>
    <span style="background:rgba(196,122,0,0.14);color:#c47a00;padding:4px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:999px;background:#c47a00;"></span>TRIAL</span>
    <span style="background:var(--color-poppy-wash);color:var(--color-poppy);padding:4px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:999px;background:var(--color-poppy);"></span>EXPIRADO</span>
    <span style="background:var(--color-poppy);color:#fff;padding:4px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;">ADMIN</span>
    <span style="background:var(--color-cobalt-wash);color:var(--color-cobalt);padding:4px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;">MIEMBRO</span>
  </div>
  <div class="row" style="margin-top: 12px; gap: 8px; flex-wrap: wrap;">
    <span style="background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border);padding:4px 10px;border-radius:4px;font-family:var(--font-mono);font-size:11px;font-weight:500;">PRO</span>
    <span style="background:var(--color-poppy-wash);color:var(--color-poppy);border:1px solid rgba(217,33,33,0.3);padding:4px 10px;border-radius:4px;font-family:var(--font-sans);font-size:11px;font-weight:600;">Nuevo</span>
    <span style="background:var(--color-ink);color:#fff;padding:4px 10px;border-radius:4px;font-family:var(--font-sans);font-size:11px;font-weight:600;">v1.0</span>
  </div>
</div></body></html>
