  </div>

  </div>
    <div style="background:#d92121;color:#fff;border-radius:4px;padding:14px 14px;display:flex;flex-direction:column;gap:12px;min-height:84px;justify-content:space-between;font-family:var(--font-mono);">

  </div>
  </div>
  <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap;">

    <span style="background: rgba(0,71,171,0.10); color: #0047ab; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 600; font-family: var(--font-mono); letter-spacing: 0.06em;">● INFO</span>
