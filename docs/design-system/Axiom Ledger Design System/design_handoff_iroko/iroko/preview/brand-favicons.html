<!doctype html>
<!-- @dsCard group="Brand" name="Brand / Favicons" -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Favicons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: end; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; }
  .tile.dark { background: #0e1117; }
  .tile.dark .lbl { color: rgba(230,232,235,0.6); }
  .tile img { display: block; image-rendering: -webkit-optimize-contrast; }
  .lbl { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-tertiary); }
  .size { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--text-primary); }
  .ctx { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; }
  .tab { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 6px 6px 0 0; padding: 6px 12px 6px 10px; font-size: 12px; color: var(--text-primary); }
  .tab img { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="pad">
  <div class="label" style="margin-bottom: 14px;">Favicons · SVG vector + PNG raster</div>

  <div class="grid">
    <div class="tile">
      <img src="../assets/favicon-16.png" width="16" height="16" alt="">
      <span class="size">16×16</span>
      <span class="lbl">tab</span>
    </div>
    <div class="tile">
      <img src="../assets/favicon-32.png" width="32" height="32" alt="">
      <span class="size">32×32</span>
      <span class="lbl">retina tab</span>
    </div>
    <div class="tile">
      <img src="../assets/favicon-48.png" width="48" height="48" alt="">
      <span class="size">48×48</span>
      <span class="lbl">windows</span>
    </div>
    <div class="tile">
      <img src="../assets/favicon-64.png" width="64" height="64" alt="">
      <span class="size">64×64</span>
      <span class="lbl">desktop</span>
    </div>
    <div class="tile">
      <img src="../assets/apple-touch-icon.png" width="64" height="64" alt="">
      <span class="size">180×180</span>
      <span class="lbl">iOS home</span>
    </div>
    <div class="tile dark">
      <img src="../assets/icon-512.png" width="64" height="64" alt="">
      <span class="size" style="color: #e6e8eb;">512×512</span>
      <span class="lbl">PWA / OG</span>
    </div>
  </div>

  <div class="ctx">
    <span class="tab">
      <img src="../assets/favicon-32.png" alt="">
      <span>iroko.dev</span>
      <span style="color: var(--text-tertiary); margin-left: 4px;">×</span>
    </span>
    <span class="mono" style="font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.04em;">Browser tab preview</span>
  </div>
</div>
</body>
</html>
