<!doctype html>
<!-- @dsCard group="Colors" name="Colors / Action" --><html lang="es"><head>
<meta charset="utf-8"><title>Action</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom:12px;">Action · Poppy ramp (primary)</div>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
    <div style="background:#b11226;color:#fff;border-radius:4px;padding:14px 14px;display:flex;flex-direction:column;gap:12px;min-height:84px;justify-content:space-between;font-family:var(--font-mono);">
    <div style="font-size:10px;font-weight:600;letter-spacing:0.02em;">crimson</div>
    <div><div style="font-size:11px;font-weight:600;">#B11226</div><div style="font-size:9px;opacity:0.7;margin-top:2px;letter-spacing:0.02em;">pressed / dark</div></div>
  </div>
    <div style="background:#d92121;color:#fff;border-radius:4px;padding:14px 14px;display:flex;flex-direction:column;gap:12px;min-height:84px;justify-content:space-between;font-family:var(--font-mono);">
    <div style="font-size:10px;font-weight:600;letter-spacing:0.02em;">poppy</div>
    <div><div style="font-size:11px;font-weight:600;">#D92121</div><div style="font-size:9px;opacity:0.7;margin-top:2px;letter-spacing:0.02em;">primary</div></div>
  </div>
    <div style="background:#ff3a3a;color:#fff;border-radius:4px;padding:14px 14px;display:flex;flex-direction:column;gap:12px;min-height:84px;justify-content:space-between;font-family:var(--font-mono);">
    <div style="font-size:10px;font-weight:600;letter-spacing:0.02em;">poppy soft</div>
    <div><div style="font-size:11px;font-weight:600;">#FF3A3A</div><div style="font-size:9px;opacity:0.7;margin-top:2px;letter-spacing:0.02em;">hover / hot</div></div>
  </div>
  </div>
  <div class="row" style="margin-top:14px;gap:10px;flex-wrap:wrap;">
    <span style="background: var(--color-poppy-wash); color: var(--color-poppy); padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: 600;">poppy-wash 10%</span>
    <button style="background: var(--color-poppy); color: #fff; padding: 8px 18px; border-radius: 4px; border: 0; font-size: 13px; font-weight: 600;">Crear proyecto</button>
    <button style="background: transparent; color: var(--color-poppy); border: 1px solid var(--color-poppy); padding: 7px 18px; border-radius: 4px; font-size: 13px; font-weight: 600;">Outline</button>
  </div>
</div></body></html>
