<!doctype html>
<!-- @dsCard group="Components" name="Components / KPI" --><html lang="es"><head>
<meta charset="utf-8"><title>KPI</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="pad">
  <div class="label" style="margin-bottom: 14px;">KPI Card · dashboard overview</div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
    <div style="background:var(--surface-elevated);border:1px solid var(--border);border-radius:6px;padding:18px;">
      <div class="row" style="justify-content:space-between;margin-bottom:14px;">
        <span class="label">MRR</span>
        <i data-lucide="trending-up" style="stroke-width:1.5;width:18px;height:18px;color:var(--text-tertiary);"></i>
      </div>
      <div class="mono" style="font-size:30px;font-weight:600;letter-spacing:-0.04em;line-height:1;">$4,820</div>
      <div class="row" style="margin-top:10px;gap:8px;">
        <span style="background:rgba(30,138,79,0.12);color:#1e8a4f;padding:2px 8px;border-radius:4px;font-family:var(--font-mono);font-size:10px;font-weight:700;">+12.4%</span>
        <span class="mono" style="font-size:10px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;">vs mes</span>
      </div>
    </div>
    <div style="background:var(--surface-elevated);border:1px solid var(--border);border-radius:6px;padding:18px;">
      <div class="row" style="justify-content:space-between;margin-bottom:14px;">
        <span class="label">Proyectos activos</span>
        <i data-lucide="orbit" style="stroke-width:1.5;width:18px;height:18px;color:var(--color-poppy);"></i>
      </div>
      <div class="mono" style="font-size:30px;font-weight:600;letter-spacing:-0.04em;line-height:1;">12</div>
      <div class="row" style="margin-top:10px;gap:8px;">
        <span style="background:var(--color-cobalt-wash);color:var(--color-cobalt);padding:2px 8px;border-radius:4px;font-family:var(--font-mono);font-size:10px;font-weight:700;">+3</span>
        <span class="mono" style="font-size:10px;color:var(--text-tertiary);letter-spacing:0.08em;text-transform:uppercase;">esta semana</span>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>lucide.createIcons();</script></body></html>
