<!doctype html>
<!-- @dsCard group="Brand" name="UI Kit / Iroko Dashboard" -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iroko · Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/apple-touch-icon.png">
  <link rel="manifest" href="../../assets/site.webmanifest">
  <meta name="theme-color" content="#0e1117">
  <meta name="viewport" content="width=1320">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="Topbar.jsx"></script>
  <script type="text/babel" src="OverviewScreen.jsx"></script>
  <script type="text/babel" src="MembersScreen.jsx"></script>
  <script type="text/babel" src="BillingScreen.jsx"></script>
  <script type="text/babel" src="SettingsScreen.jsx"></script>
  <script type="text/babel" src="ProjectsScreen.jsx"></script>
  <script type="text/babel" src="Login.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_USER = { name: 'Pipe Cárdenas', email: 'pipec@iroko.dev' };
    const DEFAULT_ORGS = [
      { id: 'ace',   name: 'Ace Jewelry',    plan: 'Studio', initial: 'AJ', tone: 'iron'  },
      { id: 'maker', name: 'Maker Lab CL',   plan: 'Studio', initial: 'ML', tone: 'gold'  },
      { id: 'pipec', name: 'Pipec personal', plan: 'Free',   initial: 'PC', tone: 'night' },
    ];

    function App() {
      const [signedIn, setSignedIn] = useState(false);
      const [route, setRoute] = useState('overview');
      const [org, setOrg] = useState(DEFAULT_ORGS[0]);

      useEffect(() => { window.lucide?.createIcons(); }, [route, signedIn]);

      if (!signedIn) return <Login onSubmit={() => setSignedIn(true)} />;

      const screens = {
        overview: <OverviewScreen user={DEFAULT_USER} org={org} />,
        projects: <ProjectsScreen />,
        members:  <MembersScreen />,
        billing:  <BillingScreen />,
        settings: <SettingsScreen />,
      };

      return (
        <div className="shell">
          <Sidebar
            active={route}
            onNavigate={setRoute}
            currentOrg={org}
            onSwitchOrg={setOrg}
          />
          <div className="main">
            <Topbar
              user={DEFAULT_USER}
              org={org}
              route={route}
              onSignOut={() => setSignedIn(false)}
            />
            <div className="content">
              {screens[route] || <div style={{padding:'40px 0'}}><h1>{route}</h1></div>}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
